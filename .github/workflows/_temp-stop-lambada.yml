name: temp-stop-lambada

on:
  push:
    branches: [task-d/eink-web-premium-ui-v2-clock-card]
    paths: [.github/workflows/_temp-stop-lambada.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-d/eink-web-premium-ui-v2-clock-card
          fetch-depth: 0
      - name: Stop preview/apply state fight
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n=text.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              return text.replace(old,new,1)

          # Global authority flag is set as soon as bridge JS evaluates.
          p=Path('web/clock-app/device-target-preview.js')
          s=p.read_text(encoding='utf-8')
          s=once(s,"(() => {\n  const WIDTH=250;","(() => {\n  window.__einkCustomDeviceApplyReady=true;\n  const WIDTH=250;",'bridge ready flag')
          p.write_text(s,encoding='utf-8')

          # Clock Classic preview must stop disabling/relabeling the apply button once device bridge exists.
          p=Path('web/clock-app/panel-registry.js')
          s=p.read_text(encoding='utf-8')
          old="""  function syncClassicApply(active){
    const apply=document.getElementById('profileApply');
    if(!apply)return;
    if(active){
      if(!apply.dataset.classicOriginalLabel)apply.dataset.classicOriginalLabel=apply.textContent||'Áp dụng lên màn';
      apply.dataset.classicPreview='true';
      apply.textContent='Preview web — chưa áp dụng';
      apply.disabled=true;
      apply.setAttribute('aria-disabled','true');
    }else if(apply.dataset.classicPreview==='true'){
      apply.textContent=apply.dataset.classicOriginalLabel||'Áp dụng lên màn';
      apply.disabled=false;
      apply.removeAttribute('aria-disabled');
      delete apply.dataset.classicPreview;
    }
  }
"""
          new="""  function syncClassicApply(active){
    const apply=document.getElementById('profileApply');
    if(!apply)return;
    if(active&&window.__einkCustomDeviceApplyReady)return;
    if(active){
      if(!apply.dataset.classicOriginalLabel)apply.dataset.classicOriginalLabel=apply.textContent||'Áp dụng lên màn';
      apply.dataset.classicPreview='true';
      apply.textContent='Preview web — chưa áp dụng';
      apply.disabled=true;
      apply.setAttribute('aria-disabled','true');
    }else if(apply.dataset.classicPreview==='true'){
      apply.textContent=apply.dataset.classicOriginalLabel||'Áp dụng lên màn';
      apply.disabled=false;
      apply.removeAttribute('aria-disabled');
      delete apply.dataset.classicPreview;
    }
  }
"""
          s=once(s,old,new,'classic apply gate')
          p.write_text(s,encoding='utf-8')

          # Week preview gets the same rule.
          p=Path('web/clock-app/weekly-calendar-preview.js')
          s=p.read_text(encoding='utf-8')
          old="""  function setApplyPreview(active){
    const apply=document.getElementById('profileApply');
    if(!apply)return;
    if(active){
      if(!apply.dataset.weekOriginalLabel)apply.dataset.weekOriginalLabel=apply.textContent||'Áp dụng lên màn';
      apply.dataset.weekPreview='true';
      apply.textContent='Preview web — chưa áp dụng';
      apply.disabled=true;
      apply.setAttribute('aria-disabled','true');
    }else if(apply.dataset.weekPreview==='true'){
      apply.textContent=apply.dataset.weekOriginalLabel||'Áp dụng lên màn';
      apply.disabled=false;
      apply.removeAttribute('aria-disabled');
      delete apply.dataset.weekPreview;
    }
  }
"""
          new="""  function setApplyPreview(active){
    const apply=document.getElementById('profileApply');
    if(!apply)return;
    if(active&&window.__einkCustomDeviceApplyReady)return;
    if(active){
      if(!apply.dataset.weekOriginalLabel)apply.dataset.weekOriginalLabel=apply.textContent||'Áp dụng lên màn';
      apply.dataset.weekPreview='true';
      apply.textContent='Preview web — chưa áp dụng';
      apply.disabled=true;
      apply.setAttribute('aria-disabled','true');
    }else if(apply.dataset.weekPreview==='true'){
      apply.textContent=apply.dataset.weekOriginalLabel||'Áp dụng lên màn';
      apply.disabled=false;
      apply.removeAttribute('aria-disabled');
      delete apply.dataset.weekPreview;
    }
  }
"""
          s=once(s,old,new,'week apply gate')
          p.write_text(s,encoding='utf-8')

          print('PATCH PASS: old preview gates yield to device apply bridge')
          PY
      - name: Verify
        shell: bash
        run: |
          grep -q "__einkCustomDeviceApplyReady=true" web/clock-app/device-target-preview.js
          grep -q "active&&window.__einkCustomDeviceApplyReady" web/clock-app/panel-registry.js
          grep -q "active&&window.__einkCustomDeviceApplyReady" web/clock-app/weekly-calendar-preview.js
          git diff --check
      - name: Commit exact files and self-remove
        shell: bash
        run: |
          rm .github/workflows/_temp-stop-lambada.yml
          git config user.name eink-harness
          git config user.email eink-harness@users.noreply.github.com
          git add web/clock-app/device-target-preview.js web/clock-app/panel-registry.js web/clock-app/weekly-calendar-preview.js
          git add -u .github/workflows/_temp-stop-lambada.yml
          git diff --cached --check
          git commit -m "fix: stop custom profile apply state flicker"
          git push origin HEAD:task-d/eink-web-premium-ui-v2-clock-card
